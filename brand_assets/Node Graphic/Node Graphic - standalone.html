  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7a82b06f-bb56-465c-9d89-00c2e74a6cc5\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c8c3ad7f-314b-4d25-bdc2-9a0ce007c8ec\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"bb850538-37e2-476c-901a-c7b6ed985656\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7320f721-5740-42b2-80f9-2db556be4bcf\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ── PRIMARY PALETTE (Sienna) ───────────────────────────── */\n  --rf-primary:     #361F1D; /* Deep warm brown — navs, heroes, footer bg, primary headings */\n  --rf-accent:      #743734; /* Brick — sub-headings, hover states, pull quotes */\n  --rf-highlight:   #FF6139; /* Coral-orange — CTAs, +, section labels, key metrics */\n\n  /* Deeper ambient tones used in gradients */\n  --rf-primary-deep:    #2a1816; /* Hero gradient start, footer deep */\n  --rf-primary-mid:     #4a2826; /* Hero gradient end, service card hover */\n  --rf-footer-bg:       #1a0f0e; /* Deep footer */\n  --rf-card-dark:       #2d1a18; /* Card on dark sections */\n\n  /* ── SECONDARY PALETTE ──────────────────────────────────── */\n  --rf-secondary:   #A1CACC; /* Blue-green — trust signals, secondary labels on dark */\n  --rf-background:  #F5F5ED; /* Warm off-white page bg */\n  --rf-background-alt: #EFEFE7; /* Slightly deeper off-white for strips */\n  --rf-white:       #FFFFFF;\n\n  /* ── TEXT COLOURS ───────────────────────────────────────── */\n  --rf-body:        #1A1A1A; /* Primary body copy */\n  --rf-mid-grey:    #6B5350; /* Secondary / captions (warm grey) */\n  --rf-light-grey:  #D8D0C8; /* Borders, dividers */\n\n  /* Alpha tints (white on dark, dark on light) */\n  --rf-on-dark-90:  rgba(255,255,255,0.90);\n  --rf-on-dark-70:  rgba(255,255,255,0.70);\n  --rf-on-dark-55:  rgba(255,255,255,0.55);\n  --rf-on-dark-45:  rgba(255,255,255,0.45);\n  --rf-on-dark-30:  rgba(255,255,255,0.30);\n\n  /* ── SEMANTIC TOKENS ────────────────────────────────────── */\n  --rf-fg:          var(--rf-body);\n  --rf-fg-muted:    var(--rf-mid-grey);\n  --rf-bg:          var(--rf-background);\n  --rf-bg-surface:  var(--rf-white);\n  --rf-bg-inverse:  var(--rf-primary);\n  --rf-border:      var(--rf-light-grey);\n  --rf-action:      var(--rf-highlight);\n\n  /* ── TYPOGRAPHY STACKS ──────────────────────────────────── */\n  --rf-font-display: 'Playfair Display', 'Iowan Old Style', Georgia, 'Times New Roman', serif;\n  --rf-font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;\n\n  /* ── TYPE SCALE (desktop) ───────────────────────────────── */\n  /* Weights: display 700 / 400; body 300, 400, 500, 600 */\n  --rf-display-size:   52px;  /* Hero H1 */\n  --rf-h1-size:        42px;  /* Page title */\n  --rf-h2-size:        38px;  /* Section */\n  --rf-h3-size:        28px;  /* Sub-section */\n  --rf-h4-size:        22px;  /* Card title */\n  --rf-lead-size:      17px;  /* Lead / intro paragraph */\n  --rf-body-size:      15px;  /* Body copy */\n  --rf-small-size:     13px;  /* Secondary body */\n  --rf-caption-size:   11px;  /* Captions, eyebrows */\n  --rf-label-size:     10px;  /* ALL CAPS section labels */\n\n  /* Line heights */\n  --rf-lh-body:    1.7;\n  --rf-lh-heading: 1.15;\n  --rf-lh-tight:   1.08;\n  --rf-lh-caption: 1.4;\n\n  /* Tracking */\n  --rf-tracking-display:  -0.025em;\n  --rf-tracking-heading:  -0.02em;\n  --rf-tracking-tight:   -0.01em;\n  --rf-tracking-label:    0.14em;  /* Section labels, uppercase small */\n  --rf-tracking-mini:     0.1em;   /* Numbered 01, 02 tags */\n\n  /* ── SPACING SCALE ──────────────────────────────────────── */\n  /* 4px base grid, intentional steps */\n  --rf-space-1:   4px;\n  --rf-space-2:   8px;\n  --rf-space-3:  12px;\n  --rf-space-4:  16px;\n  --rf-space-5:  20px;\n  --rf-space-6:  24px;\n  --rf-space-8:  32px;\n  --rf-space-10: 40px;\n  --rf-space-12: 48px;\n  --rf-space-16: 64px;\n  --rf-space-20: 80px;\n  --rf-space-24: 96px;  /* Section vertical padding on desktop */\n\n  /* ── RADII ──────────────────────────────────────────────── */\n  /* Brand is angular. Corners are deliberately hard. */\n  --rf-radius-0:  0;       /* DEFAULT. Cards, buttons, chips — no rounding. */\n  --rf-radius-sm: 3px;     /* Rare — tiny pills only */\n  --rf-radius-full: 9999px;/* Avatar monograms, social icons */\n\n  /* ── BORDERS ────────────────────────────────────────────── */\n  --rf-border-accent:  3px solid var(--rf-highlight); /* Top accent on cards, pull-quote left border */\n  --rf-border-accent-dim: 3px solid rgba(255,97,57,0.3);\n  --rf-divider-light:  1px solid var(--rf-light-grey);\n  --rf-divider-dark:   1px solid rgba(255,255,255,0.08);\n\n  /* ── SHADOWS ────────────────────────────────────────────── */\n  /* Subtle warm-toned shadow, not flat grey */\n  --rf-shadow-card:    0 4px 24px rgba(54,31,29,0.06);\n  --rf-shadow-hover:   0 8px 32px rgba(54,31,29,0.12);\n  --rf-shadow-ring:    0 0 0 4px rgba(161,202,204,0.06); /* ring on dark surfaces */\n\n  /* ── MOTION ─────────────────────────────────────────────── */\n  --rf-transition-fast: 0.15s;\n  --rf-transition:      0.2s;\n  --rf-ease:            ease;\n\n  /* ── LAYOUT ─────────────────────────────────────────────── */\n  --rf-container:      1100px;\n  --rf-section-pad-x:  48px;  /* Desktop horizontal section padding */\n  --rf-section-pad-y:  96px;\n}\n\n/* ─────────────────────────────────────────────────────────────\n   BASE ELEMENT STYLES\n   ───────────────────────────────────────────────────────────── */\nbody {\n  font-family: var(--rf-font-body);\n  font-size: var(--rf-body-size);\n  line-height: var(--rf-lh-body);\n  color: var(--rf-body);\n  background: var(--rf-background);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n/* Headings — sentence case. Never Title Case. */\nh1, h2, h3, h4 {\n  font-family: var(--rf-font-display);\n  font-weight: 700;\n  color: var(--rf-primary);\n  line-height: var(--rf-lh-heading);\n  letter-spacing: var(--rf-tracking-heading);\n}\nh1 { font-size: var(--rf-h1-size); letter-spacing: var(--rf-tracking-display); line-height: var(--rf-lh-tight); }\nh2 { font-size: var(--rf-h2-size); }\nh3 { font-size: var(--rf-h3-size); }\nh4 { font-size: var(--rf-h4-size); color: var(--rf-accent); } /* H4 shifts to accent brick */\n\np  { font-size: var(--rf-body-size); line-height: var(--rf-lh-body); color: var(--rf-body); }\n\nem, i { font-style: italic; }\nstrong, b { font-weight: 600; color: inherit; }\n\nhr {\n  border: 0;\n  border-top: var(--rf-divider-light);\n  margin: var(--rf-space-8) 0;\n}\n\n/* Links are coral when they're actions; brick when inline in body */\na { color: var(--rf-accent); text-decoration: underline; text-underline-offset: 3px; }\na:hover { color: var(--rf-highlight); }\n\n/* ─────────────────────────────────────────────────────────────\n   UTILITY / SEMANTIC CLASSES\n   ───────────────────────────────────────────────────────────── */\n\n/* Display hero headline — Playfair 52px, tight leading */\n.rf-display {\n  font-family: var(--rf-font-display);\n  font-weight: 700;\n  font-size: var(--rf-display-size);\n  line-height: var(--rf-lh-tight);\n  letter-spacing: var(--rf-tracking-display);\n  color: var(--rf-primary);\n}\n\n/* Eyebrow / section label — ALL CAPS, coral, tracked */\n.rf-label {\n  font-family: var(--rf-font-body);\n  font-size: var(--rf-caption-size);\n  font-weight: 600;\n  letter-spacing: var(--rf-tracking-label);\n  text-transform: uppercase;\n  color: var(--rf-highlight);\n  display: inline-block;\n}\n.rf-label--light { color: var(--rf-secondary); } /* On dark surfaces, use blue-green */\n\n/* Lead / intro paragraph — slightly larger, often italic Playfair */\n.rf-lead {\n  font-family: var(--rf-font-display);\n  font-size: var(--rf-lead-size);\n  font-weight: 500;\n  font-style: italic;\n  line-height: 1.55;\n  color: var(--rf-accent);\n}\n\n/* Body / caption utility */\n.rf-body { font-size: var(--rf-body-size); line-height: var(--rf-lh-body); color: var(--rf-body); }\n.rf-body-muted { color: var(--rf-mid-grey); }\n.rf-caption {\n  font-size: var(--rf-caption-size);\n  color: var(--rf-mid-grey);\n  line-height: var(--rf-lh-caption);\n  letter-spacing: 0.02em;\n}\n\n/* Small numeric/alpha label: \"01\", \"02\" used inside cards */\n.rf-mini-num {\n  font-family: var(--rf-font-body);\n  font-size: var(--rf-label-size);\n  font-weight: 700;\n  letter-spacing: var(--rf-tracking-mini);\n  color: var(--rf-highlight);\n}\n\n/* Pull quote — left coral rule, warm off-white tint */\n.rf-pullquote {\n  border-left: var(--rf-border-accent);\n  padding: var(--rf-space-5) var(--rf-space-8);\n  background: rgba(54,31,29,0.04);\n  font-family: var(--rf-font-display);\n  font-weight: 700;\n  font-style: italic;\n  font-size: 20px;\n  line-height: 1.4;\n  color: var(--rf-primary);\n}\n\n/* Surfaces */\n.rf-surface-light    { background: var(--rf-background); color: var(--rf-body); }\n.rf-surface-lighter  { background: var(--rf-background-alt); color: var(--rf-body); }\n.rf-surface-card     { background: var(--rf-white); color: var(--rf-body); }\n.rf-surface-dark     { background: var(--rf-primary); color: var(--rf-on-dark-70); }\n.rf-surface-deep     { background: var(--rf-primary-deep); color: var(--rf-on-dark-70); }\n\n/* Coral action button — hard corners, small uppercase */\n.rf-btn-primary {\n  display: inline-block;\n  background: var(--rf-highlight);\n  color: var(--rf-white);\n  font-family: var(--rf-font-body);\n  font-size: var(--rf-caption-size);\n  font-weight: 600;\n  letter-spacing: 0.07em;\n  text-transform: uppercase;\n  padding: 14px 28px;\n  border: none;\n  border-radius: var(--rf-radius-0);\n  cursor: pointer;\n  text-decoration: none;\n  transition: opacity var(--rf-transition);\n}\n.rf-btn-primary:hover  { opacity: 0.88; color: var(--rf-white); }\n.rf-btn-primary:active { transform: translateY(1px); }\n.rf-btn-primary:focus-visible { outline: 2px solid var(--rf-highlight); outline-offset: 3px; }\n\n.rf-btn-ghost {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  color: var(--rf-on-dark-45);\n  font-size: var(--rf-small-size);\n  font-weight: 400;\n  background: none;\n  border: none;\n  cursor: pointer;\n  text-decoration: none;\n  transition: color var(--rf-transition);\n}\n.rf-btn-ghost:hover { color: var(--rf-on-dark-70); }\n\n/* Card with coral top rule — the signature container */\n.rf-card {\n  background: var(--rf-white);\n  border-top: var(--rf-border-accent);\n  padding: 24px 20px;\n}\n.rf-card--dim { border-top-color: rgba(255,97,57,0.3); }\n\n/* Responsive type (mobile) */\n@media (max-width: 767px) {\n  :root {\n    --rf-display-size: 32px;\n    --rf-h1-size: 28px;\n    --rf-h2-size: 26px;\n    --rf-h3-size: 22px;\n    --rf-section-pad-x: 24px;\n    --rf-section-pad-y: 64px;\n  }\n}\n<\u002Fstyle>\n\n\n<style>\n  :root{\n    /* Local stage tokens — derive from the brand palette but tuned for a dark, atmospheric hero */\n    --stage-bg-1: #1A0F0E;          /* deeper than --rf-primary, gives the nodes more air */\n    --stage-bg-2: #2A1A18;\n    --stage-vignette: rgba(0,0,0,0.55);\n  }\n\n  html, body{\n    margin:0;\n    padding:0;\n    background:var(--rf-primary);\n    color:var(--rf-white);\n    font-family: var(--rf-font-sans, 'Inter', system-ui, sans-serif);\n    overflow:hidden;\n    height:100%;\n  }\n\n  /* Full-bleed stage */\n  .stage{\n    position:fixed;\n    inset:0;\n    background:\n      radial-gradient(ellipse 80% 60% at 30% 40%, var(--stage-bg-2) 0%, var(--stage-bg-1) 55%, #0E0807 100%);\n    overflow:hidden;\n  }\n\n  canvas{\n    position:absolute;\n    inset:0;\n    width:100%;\n    height:100%;\n    display:block;\n  }\n\n  /* Vignette + grain over the canvas to give it weight */\n  .stage::after{\n    content:\"\";\n    position:absolute;\n    inset:0;\n    pointer-events:none;\n    background:\n      radial-gradient(ellipse 100% 80% at 50% 50%, transparent 50%, var(--stage-vignette) 100%);\n    z-index:2;\n  }\n\n  /* Brand overlay — optional copy to demonstrate hero usage */\n  .overlay{\n    position:absolute;\n    inset:0;\n    z-index:3;\n    pointer-events:none;\n    display:grid;\n    grid-template-rows: auto 1fr auto;\n    padding: clamp(28px, 4vw, 64px);\n  }\n\n  .overlay-top{\n    display:flex;\n    justify-content:space-between;\n    align-items:flex-start;\n    gap:24px;\n  }\n\n  .brand{\n    font-family: 'Playfair Display', serif;\n    font-weight:700;\n    font-size: clamp(18px, 1.6vw, 22px);\n    line-height:1;\n    letter-spacing:-0.01em;\n  }\n  .brand .a{ color:var(--rf-white); }\n  .brand .b{ color:var(--rf-secondary); }\n  .brand .plus{ color:var(--rf-highlight); margin-left:2px; }\n\n  .meta{\n    text-align:right;\n    font-size:11px;\n    font-weight:600;\n    letter-spacing:0.14em;\n    text-transform:uppercase;\n    color:var(--rf-secondary);\n  }\n  .meta .num{\n    display:block;\n    font-family:'Playfair Display', serif;\n    font-weight:700;\n    font-size: clamp(36px, 4vw, 56px);\n    color:var(--rf-white);\n    letter-spacing:-0.02em;\n    line-height:1;\n    margin-top:8px;\n    text-transform:none;\n  }\n\n  .overlay-mid{\n    align-self:center;\n    max-width: 640px;\n  }\n  .eyebrow{\n    font-size:11px;\n    font-weight:600;\n    letter-spacing:0.14em;\n    text-transform:uppercase;\n    color:var(--rf-highlight);\n    margin-bottom:20px;\n    display:flex;\n    align-items:center;\n    gap:12px;\n  }\n  .eyebrow::before{\n    content:\"\";\n    width:32px;\n    height:1px;\n    background:var(--rf-highlight);\n  }\n  .headline{\n    font-family:'Playfair Display', serif;\n    font-weight:700;\n    font-size: clamp(36px, 5.2vw, 68px);\n    line-height: 1.05;\n    letter-spacing:-0.015em;\n    color:var(--rf-white);\n    margin:0 0 20px;\n    text-wrap:balance;\n  }\n  .headline em{\n    color:var(--rf-secondary);\n    font-style:italic;\n  }\n  .sub{\n    font-family:'Playfair Display', serif;\n    font-weight:500;\n    font-style:italic;\n    font-size: clamp(15px, 1.3vw, 18px);\n    line-height:1.55;\n    color: rgba(255,255,255,0.72);\n    max-width:480px;\n  }\n\n  .overlay-bottom{\n    display:flex;\n    justify-content:space-between;\n    align-items:flex-end;\n    gap:24px;\n    color: rgba(255,255,255,0.55);\n    font-size:11px;\n    font-weight:600;\n    letter-spacing:0.14em;\n    text-transform:uppercase;\n  }\n  .overlay-bottom .index{\n    font-family:'Playfair Display', serif;\n    font-weight:700;\n    font-size: clamp(28px, 3vw, 42px);\n    color:var(--rf-white);\n    letter-spacing:-0.02em;\n    line-height:1;\n    text-transform:none;\n  }\n  .overlay-bottom .label{\n    max-width:280px;\n    text-align:right;\n    color:rgba(255,255,255,0.5);\n  }\n\n  /* Hide overlay if user just wants the raw graphic — toggled by tweak */\n  body.bare .overlay{ display:none; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  <div class=\"stage\">\n    <canvas id=\"c\"><\u002Fcanvas>\n\n    <div class=\"overlay\">\n      <div class=\"overlay-top\">\n        <div class=\"brand\"><span class=\"a\">resilient<\u002Fspan><span class=\"b\">futures<\u002Fspan><span class=\"plus\">+<\u002Fspan><\u002Fdiv>\n        <div class=\"meta\">\n          Strategic fitness index\n          <span class=\"num\">5,000<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"overlay-mid\">\n        <div class=\"eyebrow\">Strategy in Action<\u002Fdiv>\n        <h1 class=\"headline\">Strategy for a world that <em>won't hold still.<\u002Fem><\u002Fh1>\n        <p class=\"sub\">A connected view of the conditions, decisions, and capabilities that compound into sustainable value — across permanent instability.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"overlay-bottom\">\n        <div><span class=\"index\">09<\u002Fspan><\u002Fdiv>\n        <div class=\"label\">Conditions watching · Change ahead of change<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<script>\n  // Load the inlined Three.js UMD bundle from window.__resources, then run our app.\n  (function loadThreeAndRun(){\n    function start(){\n      const script = document.createElement('script');\n      script.src = window.__resources.threeUmd;\n      script.onload = () => {\n        // Three.js UMD attaches THREE to window — our app reads from there.\n        const appScript = document.getElementById('__app_script');\n        const code = appScript.textContent;\n        const tag = document.createElement('script');\n        tag.textContent = code;\n        document.body.appendChild(tag);\n      };\n      document.head.appendChild(script);\n    }\n    if (window.__resources && window.__resources.threeUmd) start();\n    else window.addEventListener('load', start);\n  })();\n<\u002Fscript>\n\n<script id=\"__app_script\" type=\"text/plain\">\nconst THREE = window.THREE;\n\n/* =========================================================\n   Resilient Futures — 3D node graphic\n   - Particle field shaped as a rising \"ridge\" (low-left → high-right)\n   - Lines connect any two points within a radius (limited per node)\n   - Gentle continuous animation: drift on the noise field + camera parallax\n   ========================================================= */\n\nconst canvas = document.getElementById('c');\nconst renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });\nrenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\nrenderer.setClearColor(0x000000, 0);\n\nconst scene = new THREE.Scene();\n\n// Subtle exponential fog so distant nodes fade into the background\nscene.fog = new THREE.FogExp2(0x150B0A, 0.018);\n\nconst camera = new THREE.PerspectiveCamera(45, 1, 0.1, 500);\ncamera.position.set(0, 6, 38);\ncamera.lookAt(0, 2, 0);\n\n/* ---------- Brand palette (matches --rf-* tokens) ---------- */\nconst COLORS = {\n  node:      new THREE.Color('#A1CACC'),  // secondary — blue-green\n  nodeDim:   new THREE.Color('#6B5350'),  // mid-grey\n  highlight: new THREE.Color('#FF6139'),  // coral CTA\n  accent:    new THREE.Color('#C8B8A8'),  // warm light\n  line:      new THREE.Color('#A1CACC'),\n};\n\n/* =========================================================\n   Generate the node field\n   - Nodes laid out across a wide X / shallow Z plane\n   - Y is driven by a layered noise function so the surface\n     reads as a rising mountain ridge from lower-left to upper-right\n   ========================================================= */\n\nconst NODE_COUNT = 420;\nconst FIELD_W = 70;     // x extent\nconst FIELD_D = 26;     // z extent\nconst RIDGE_GAIN = 18;  // how high the right side climbs\n\n// Cheap value-noise (deterministic, smooth enough for a height field)\nfunction hash(x, y){\n  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;\n  return s - Math.floor(s);\n}\nfunction smoothstep(t){ return t*t*(3-2*t); }\nfunction valueNoise(x, y){\n  const xi = Math.floor(x), yi = Math.floor(y);\n  const xf = x - xi, yf = y - yi;\n  const a = hash(xi,   yi);\n  const b = hash(xi+1, yi);\n  const c = hash(xi,   yi+1);\n  const d = hash(xi+1, yi+1);\n  const u = smoothstep(xf), v = smoothstep(yf);\n  return THREE.MathUtils.lerp(\n    THREE.MathUtils.lerp(a, b, u),\n    THREE.MathUtils.lerp(c, d, u),\n    v\n  );\n}\nfunction fbm(x, y){\n  let v = 0, amp = 0.5, freq = 1;\n  for (let i = 0; i < 4; i++){\n    v += amp * valueNoise(x*freq, y*freq);\n    freq *= 2;\n    amp *= 0.5;\n  }\n  return v; // 0..~1\n}\n\nconst nodes = []; // {pos: Vector3, basePos: Vector3, phase, sizeMul, isHi}\nfor (let i = 0; i < NODE_COUNT; i++){\n  // Slight stratification: cluster more nodes along the rising ridge\n  const u = Math.random();\n  const v = Math.random();\n  const x = (u - 0.5) * FIELD_W;\n  const z = (v - 0.5) * FIELD_D;\n\n  // Ridge height: rises steeply from left to right with noisy variation\n  const ridge = THREE.MathUtils.smoothstep(u, 0.05, 0.95); // 0..1 left→right\n  const noise = fbm(x * 0.18 + 7.3, z * 0.28 + 1.1); // 0..1\n  const ridgeY = ridge * RIDGE_GAIN;\n  const noiseY = (noise - 0.5) * 8;\n  const y = ridgeY + noiseY - 4; // shift down so center of mass is near origin\n\n  const basePos = new THREE.Vector3(x, y, z);\n  const isHi = Math.random() < 0.04; // ~4% coral highlight nodes\n  nodes.push({\n    basePos,\n    pos: basePos.clone(),\n    phase: Math.random() * Math.PI * 2,\n    sizeMul: 0.6 + Math.random() * 1.4,\n    isHi\n  });\n}\n\n/* ---------- Build line segments between nearby nodes ---------- */\n\nconst MAX_DIST = 5.2;     // connection radius\nconst MAX_LINKS_PER = 5;  // cap on links per node — prevents a hairball\n\n// Spatial bin to find neighbours quickly (O(n) instead of O(n^2) work in practice)\nconst cellSize = MAX_DIST;\nconst bins = new Map();\nconst binKey = (cx, cz) => `${cx}|${cz}`;\nnodes.forEach((n, i) => {\n  const cx = Math.floor(n.basePos.x / cellSize);\n  const cz = Math.floor(n.basePos.z / cellSize);\n  const k = binKey(cx, cz);\n  if (!bins.has(k)) bins.set(k, []);\n  bins.get(k).push(i);\n});\n\nconst linkSet = new Set();\nconst linkCount = new Int16Array(nodes.length);\nconst linkIndices = []; // [aIdx, bIdx, ...]\n\nfor (let i = 0; i < nodes.length; i++){\n  if (linkCount[i] >= MAX_LINKS_PER) continue;\n  const ni = nodes[i];\n  const cx = Math.floor(ni.basePos.x / cellSize);\n  const cz = Math.floor(ni.basePos.z / cellSize);\n\n  // Candidate neighbours from 3x3 surrounding bins\n  const cands = [];\n  for (let dx = -1; dx <= 1; dx++){\n    for (let dz = -1; dz <= 1; dz++){\n      const arr = bins.get(binKey(cx+dx, cz+dz));\n      if (arr) cands.push(...arr);\n    }\n  }\n\n  // Score by distance, then attach up to MAX_LINKS_PER closest\n  const scored = [];\n  for (const j of cands){\n    if (j <= i) continue;\n    if (linkCount[j] >= MAX_LINKS_PER) continue;\n    const d = ni.basePos.distanceTo(nodes[j].basePos);\n    if (d <= MAX_DIST) scored.push([d, j]);\n  }\n  scored.sort((a,b) => a[0] - b[0]);\n\n  for (const [, j] of scored){\n    if (linkCount[i] >= MAX_LINKS_PER) break;\n    if (linkCount[j] >= MAX_LINKS_PER) continue;\n    const key = i < j ? `${i}|${j}` : `${j}|${i}`;\n    if (linkSet.has(key)) continue;\n    linkSet.add(key);\n    linkIndices.push(i, j);\n    linkCount[i]++;\n    linkCount[j]++;\n  }\n}\n\n/* =========================================================\n   GPU geometry\n   ========================================================= */\n\n// Points (nodes)\nconst pointsGeo = new THREE.BufferGeometry();\nconst positions = new Float32Array(nodes.length * 3);\nconst colors    = new Float32Array(nodes.length * 3);\nconst sizes     = new Float32Array(nodes.length);\n\nfor (let i = 0; i < nodes.length; i++){\n  const n = nodes[i];\n  positions[i*3+0] = n.basePos.x;\n  positions[i*3+1] = n.basePos.y;\n  positions[i*3+2] = n.basePos.z;\n  const col = n.isHi\n    ? COLORS.highlight\n    : (Math.random() < 0.5 ? COLORS.node : COLORS.nodeDim.clone().lerp(COLORS.node, 0.6));\n  colors[i*3+0] = col.r; colors[i*3+1] = col.g; colors[i*3+2] = col.b;\n  sizes[i] = (n.isHi ? 0.95 : 0.7) * n.sizeMul;\n}\npointsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));\npointsGeo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));\npointsGeo.setAttribute('aSize',    new THREE.BufferAttribute(sizes, 1));\n\n// Hard-edged anti-aliased disc — solid core, single-pixel feather at the rim.\n// Drawn at high resolution so sprites stay crisp when scaled up.\nfunction makeDotTexture(){\n  const s = 128;\n  const cv = document.createElement('canvas');\n  cv.width = cv.height = s;\n  const ctx = cv.getContext('2d');\n  const cx = s/2, cy = s/2;\n  const r  = s/2 - 1;\n  const img = ctx.createImageData(s, s);\n  for (let y = 0; y < s; y++){\n    for (let x = 0; x < s; x++){\n      const dx = x - cx + 0.5;\n      const dy = y - cy + 0.5;\n      const d  = Math.sqrt(dx*dx + dy*dy);\n      // Sharp circle with 1.2px anti-aliased edge\n      const a  = Math.max(0, Math.min(1, (r - d) / 1.2));\n      const i  = (y * s + x) * 4;\n      img.data[i  ] = 255;\n      img.data[i+1] = 255;\n      img.data[i+2] = 255;\n      img.data[i+3] = Math.round(a * 255);\n    }\n  }\n  ctx.putImageData(img, 0, 0);\n  const tex = new THREE.CanvasTexture(cv);\n  tex.colorSpace = THREE.SRGBColorSpace;\n  tex.minFilter = THREE.LinearMipmapLinearFilter;\n  tex.magFilter = THREE.LinearFilter;\n  tex.generateMipmaps = true;\n  tex.anisotropy = 4;\n  return tex;\n}\nconst dotTex = makeDotTexture();\n\nconst pointsMat = new THREE.ShaderMaterial({\n  uniforms: {\n    uTex: { value: dotTex },\n    uPixelRatio: { value: renderer.getPixelRatio() },\n    uTime: { value: 0 }\n  },\n  vertexShader: /* glsl */`\n    attribute float aSize;\n    varying vec3 vColor;\n    uniform float uPixelRatio;\n    uniform float uTime;\n    void main(){\n      vColor = color;\n      vec4 mv = modelViewMatrix * vec4(position, 1.0);\n      // Subtle pulse on each node, phase-offset by world position\n      float pulse = 0.85 + 0.15 * sin(uTime * 1.2 + position.x * 0.3 + position.z * 0.5);\n      gl_PointSize = aSize * 2.2 * pulse * uPixelRatio * (300.0 / -mv.z);\n      gl_Position = projectionMatrix * mv;\n    }\n  `,\n  fragmentShader: /* glsl */`\n    uniform sampler2D uTex;\n    varying vec3 vColor;\n    void main(){\n      vec4 t = texture2D(uTex, gl_PointCoord);\n      if (t.a < 0.02) discard;\n      gl_FragColor = vec4(vColor, t.a);\n    }\n  `,\n  transparent: true,\n  depthWrite: false,\n  blending: THREE.NormalBlending,\n  vertexColors: true\n});\n\nconst points = new THREE.Points(pointsGeo, pointsMat);\nscene.add(points);\n\n// Lines — buffer of vertex pairs, colours derived per-vertex\nconst lineGeo = new THREE.BufferGeometry();\nconst linePositions = new Float32Array(linkIndices.length * 3); // 2 verts per link, 3 floats\nconst lineColors    = new Float32Array(linkIndices.length * 3);\n\nfor (let li = 0; li < linkIndices.length; li += 2){\n  const a = nodes[linkIndices[li]];\n  const b = nodes[linkIndices[li+1]];\n  const off = li * 3;\n  linePositions[off+0] = a.basePos.x;\n  linePositions[off+1] = a.basePos.y;\n  linePositions[off+2] = a.basePos.z;\n  linePositions[off+3] = b.basePos.x;\n  linePositions[off+4] = b.basePos.y;\n  linePositions[off+5] = b.basePos.z;\n\n  // Tint lines mostly secondary, occasionally coral when both endpoints are high\n  const tint = (a.isHi || b.isHi) ? COLORS.highlight : COLORS.line;\n  // Lines fade with height so the upper ridge feels lighter\n  const heightFactor = THREE.MathUtils.clamp((a.basePos.y + 4) / (RIDGE_GAIN), 0.15, 1);\n  lineColors[off+0] = tint.r * heightFactor;\n  lineColors[off+1] = tint.g * heightFactor;\n  lineColors[off+2] = tint.b * heightFactor;\n  const heightFactor2 = THREE.MathUtils.clamp((b.basePos.y + 4) / (RIDGE_GAIN), 0.15, 1);\n  lineColors[off+3] = tint.r * heightFactor2;\n  lineColors[off+4] = tint.g * heightFactor2;\n  lineColors[off+5] = tint.b * heightFactor2;\n}\nlineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));\nlineGeo.setAttribute('color',    new THREE.BufferAttribute(lineColors, 3));\n\nconst lineMat = new THREE.LineBasicMaterial({\n  vertexColors: true,\n  transparent: true,\n  opacity: 0.55,\n  depthWrite: false,\n  blending: THREE.NormalBlending\n});\nconst lines = new THREE.LineSegments(lineGeo, lineMat);\nscene.add(lines);\n\n/* =========================================================\n   Resize\n   ========================================================= */\nfunction resize(){\n  const w = canvas.clientWidth || window.innerWidth;\n  const h = canvas.clientHeight || window.innerHeight;\n  renderer.setSize(w, h, false);\n  camera.aspect = w / h;\n  camera.updateProjectionMatrix();\n  pointsMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();\n}\nwindow.addEventListener('resize', resize);\nresize();\n\n/* =========================================================\n   Animation\n   - Each node bobs along a slow Lissajous-ish path\n   - Both points buffer and matching line endpoints update each frame\n   - Camera does a slow parallax sweep on mouse / pointer\n   ========================================================= */\n\nconst pointsArr = pointsGeo.attributes.position.array;\nconst linesArr  = lineGeo.attributes.position.array;\n\n// Build a node→link incidence map so we can patch line endpoints in place\nconst incident = Array.from({length: nodes.length}, () => []);\nfor (let li = 0; li < linkIndices.length; li += 2){\n  const a = linkIndices[li], b = linkIndices[li+1];\n  incident[a].push({ linkBaseFloat: li * 3 + 0 });   // a goes into the first vertex\n  incident[b].push({ linkBaseFloat: li * 3 + 3 });   // b goes into the second vertex\n}\n\nlet mouseX = 0, mouseY = 0;\nwindow.addEventListener('pointermove', (e) => {\n  mouseX = (e.clientX / window.innerWidth)  * 2 - 1;\n  mouseY = (e.clientY / window.innerHeight) * 2 - 1;\n});\n\nconst clock = new THREE.Clock();\n\nfunction tick(){\n  const t = clock.getElapsedTime();\n  pointsMat.uniforms.uTime.value = t;\n\n  // Update node positions\n  for (let i = 0; i < nodes.length; i++){\n    const n = nodes[i];\n    const wob = 0.35;\n    const dx = Math.sin(t * 0.5 + n.phase) * wob;\n    const dy = Math.cos(t * 0.7 + n.phase * 1.3) * wob * 0.8;\n    const dz = Math.sin(t * 0.4 + n.phase * 0.7) * wob;\n\n    const px = n.basePos.x + dx;\n    const py = n.basePos.y + dy;\n    const pz = n.basePos.z + dz;\n\n    pointsArr[i*3+0] = px;\n    pointsArr[i*3+1] = py;\n    pointsArr[i*3+2] = pz;\n\n    // Patch every line endpoint that references this node\n    const inc = incident[i];\n    for (let k = 0; k < inc.length; k++){\n      const off = inc[k].linkBaseFloat;\n      linesArr[off+0] = px;\n      linesArr[off+1] = py;\n      linesArr[off+2] = pz;\n    }\n  }\n  pointsGeo.attributes.position.needsUpdate = true;\n  lineGeo.attributes.position.needsUpdate = true;\n\n  // Slow camera drift + pointer parallax\n  const camX = Math.sin(t * 0.06) * 1.5 + mouseX * 2.4;\n  const camY = 6 + Math.cos(t * 0.05) * 0.8 - mouseY * 1.2;\n  camera.position.x += (camX - camera.position.x) * 0.04;\n  camera.position.y += (camY - camera.position.y) * 0.04;\n  camera.lookAt(2, 2, 0);\n\n  renderer.render(scene, camera);\n  requestAnimationFrame(tick);\n}\ntick();\n\n/* =========================================================\n   Tweaks panel — let the user retune the brand expression\n   ========================================================= */\n\nconst TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{\n  \"showOverlay\": false,\n  \"lineOpacity\": 0.23,\n  \"highlightShare\": 0,\n  \"ridgeGain\": 0,\n  \"fogDensity\": 0,\n  \"palette\": \"coral\"\n}/*EDITMODE-END*/;\n\nlet tweaks = { ...TWEAK_DEFAULTS };\napplyTweaks(tweaks);\n\nfunction applyTweaks(t){\n  document.body.classList.toggle('bare', !t.showOverlay);\n  lineMat.opacity = t.lineOpacity;\n  scene.fog.density = t.fogDensity;\n\n  // Palette swap — recolour nodes + lines\n  const PALETTES = {\n    sienna:   { node: '#A1CACC', dim: '#6B5350', hi: '#FF6139', line: '#A1CACC', bg1:'#1A0F0E', bg2:'#2A1A18' },\n    coral:    { node: '#FF8C6B', dim: '#743734', hi: '#FFD9A8', line: '#FF6139', bg1:'#1A0F0E', bg2:'#361F1D' },\n    cool:     { node: '#A1CACC', dim: '#3A4D52', hi: '#A1CACC', line: '#A1CACC', bg1:'#0E1518', bg2:'#1A2528' },\n    parchment:{ node: '#361F1D', dim: '#A1958A', hi: '#FF6139', line: '#743734', bg1:'#F5F5ED', bg2:'#E8E1D4' },\n  };\n  const p = PALETTES[t.palette] || PALETTES.sienna;\n  COLORS.node.set(p.node);\n  COLORS.nodeDim.set(p.dim);\n  COLORS.highlight.set(p.hi);\n  COLORS.line.set(p.line);\n\n  // Re-assign which nodes are \"highlight\" using the chosen share\n  const wantedHiShare = t.highlightShare / 100;\n  const colAttr  = pointsGeo.attributes.color.array;\n  const sizeAttr = pointsGeo.attributes.aSize.array;\n  for (let i = 0; i < nodes.length; i++){\n    const n = nodes[i];\n    n.isHi = (Math.random() < wantedHiShare);\n    const col = n.isHi\n      ? COLORS.highlight\n      : (i % 2 === 0 ? COLORS.node : COLORS.nodeDim.clone().lerp(COLORS.node, 0.6));\n    colAttr[i*3+0] = col.r; colAttr[i*3+1] = col.g; colAttr[i*3+2] = col.b;\n    sizeAttr[i] = (n.isHi ? 0.95 : 0.7) * n.sizeMul;\n  }\n  pointsGeo.attributes.color.needsUpdate = true;\n  pointsGeo.attributes.aSize.needsUpdate = true;\n\n  // Recolour lines using new tint\n  for (let li = 0; li < linkIndices.length; li += 2){\n    const a = nodes[linkIndices[li]];\n    const b = nodes[linkIndices[li+1]];\n    const off = li * 3;\n    const tint = (a.isHi || b.isHi) ? COLORS.highlight : COLORS.line;\n    const hf1 = THREE.MathUtils.clamp((a.basePos.y + 4) / RIDGE_GAIN, 0.15, 1);\n    const hf2 = THREE.MathUtils.clamp((b.basePos.y + 4) / RIDGE_GAIN, 0.15, 1);\n    lineColors[off+0] = tint.r * hf1; lineColors[off+1] = tint.g * hf1; lineColors[off+2] = tint.b * hf1;\n    lineColors[off+3] = tint.r * hf2; lineColors[off+4] = tint.g * hf2; lineColors[off+5] = tint.b * hf2;\n  }\n  lineGeo.attributes.color.needsUpdate = true;\n\n  // Stage background\n  document.documentElement.style.setProperty('--stage-bg-1', p.bg1);\n  document.documentElement.style.setProperty('--stage-bg-2', p.bg2);\n  scene.fog.color.set(p.bg1);\n  document.body.style.color = (t.palette === 'parchment') ? '#1A1A1A' : '#FFFFFF';\n}\n\n/* ---------- Edit-mode protocol ---------- */\nwindow.addEventListener('message', (e) => {\n  const msg = e.data;\n  if (!msg || typeof msg !== 'object') return;\n  if (msg.type === '__activate_edit_mode')   showPanel();\n  if (msg.type === '__deactivate_edit_mode') hidePanel();\n});\nwindow.parent.postMessage({type: '__edit_mode_available'}, '*');\n\n/* ---------- Tweaks panel UI (vanilla; no React needed for this small surface) ---------- */\nfunction buildPanel(){\n  const wrap = document.createElement('div');\n  wrap.id = 'tweaks-panel';\n  wrap.innerHTML = `\n    <style>\n      #tweaks-panel{\n        position:fixed; right:24px; bottom:24px; z-index:10;\n        width:280px;\n        background:#FFFFFF;\n        color:#1A1A1A;\n        border:1px solid #D8D0C8;\n        border-top:3px solid #FF6139;\n        font-family:'Inter', system-ui, sans-serif;\n        font-size:12px;\n        padding:18px 18px 16px;\n        display:none;\n        box-shadow: 0 24px 60px rgba(0,0,0,0.35);\n      }\n      #tweaks-panel.open{display:block;}\n      #tweaks-panel header{\n        display:flex; justify-content:space-between; align-items:center;\n        font-family:'Playfair Display', serif; font-weight:700; font-size:18px;\n        color:#361F1D; margin-bottom:14px;\n      }\n      #tweaks-panel header button{\n        all:unset; cursor:pointer; font-size:14px; color:#6B5350; padding:4px 8px;\n      }\n      #tweaks-panel header button:hover{ color:#FF6139; }\n      #tweaks-panel .row{\n        display:flex; flex-direction:column; gap:6px; margin-bottom:14px;\n      }\n      #tweaks-panel label{\n        font-size:11px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase;\n        color:#6B5350;\n        display:flex; justify-content:space-between; align-items:center;\n      }\n      #tweaks-panel label span{\n        font-family:'Playfair Display', serif; font-weight:700;\n        font-size:13px; color:#361F1D; letter-spacing:0; text-transform:none;\n      }\n      #tweaks-panel input[type=range]{ width:100%; accent-color:#FF6139; }\n      #tweaks-panel .palette{\n        display:grid; grid-template-columns:repeat(4,1fr); gap:6px;\n      }\n      #tweaks-panel .swatch{\n        all:unset; cursor:pointer;\n        height:28px; border:1px solid #D8D0C8;\n        position:relative;\n        font-size:9px; font-weight:600; letter-spacing:0.08em;\n        text-transform:uppercase; color:#fff;\n        display:flex; align-items:flex-end; padding:3px 5px;\n      }\n      #tweaks-panel .swatch.active{ outline:2px solid #FF6139; outline-offset:2px; }\n      #tweaks-panel .toggle{\n        display:flex; justify-content:space-between; align-items:center;\n        padding:6px 0;\n      }\n      #tweaks-panel .toggle button{\n        all:unset; cursor:pointer;\n        width:36px; height:20px; background:#D8D0C8; border-radius:999px;\n        position:relative; transition:background 0.15s;\n      }\n      #tweaks-panel .toggle button::after{\n        content:\"\"; position:absolute; left:2px; top:2px;\n        width:16px; height:16px; background:#fff; border-radius:50%;\n        transition:left 0.15s;\n      }\n      #tweaks-panel .toggle button.on{ background:#FF6139; }\n      #tweaks-panel .toggle button.on::after{ left:18px; }\n    <\u002Fstyle>\n    <header>\n      <div>Tweaks<\u002Fdiv>\n      <button id=\"tw-close\" aria-label=\"Close\">×<\u002Fbutton>\n    <\u002Fheader>\n\n    <div class=\"row\">\n      <label>Palette<\u002Flabel>\n      <div class=\"palette\" id=\"tw-palette\">\n        <button class=\"swatch\" data-p=\"sienna\"    style=\"background:linear-gradient(135deg,#1A0F0E,#A1CACC)\">Sienna<\u002Fbutton>\n        <button class=\"swatch\" data-p=\"coral\"     style=\"background:linear-gradient(135deg,#361F1D,#FF6139)\">Coral<\u002Fbutton>\n        <button class=\"swatch\" data-p=\"cool\"      style=\"background:linear-gradient(135deg,#0E1518,#A1CACC)\">Cool<\u002Fbutton>\n        <button class=\"swatch\" data-p=\"parchment\" style=\"background:linear-gradient(135deg,#F5F5ED,#743734); color:#361F1D\">Light<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"row\">\n      <label>Line opacity <span id=\"tw-line-v\"><\u002Fspan><\u002Flabel>\n      <input id=\"tw-line\" type=\"range\" min=\"0.05\" max=\"1\" step=\"0.01\" />\n    <\u002Fdiv>\n\n    <div class=\"row\">\n      <label>Highlight density <span id=\"tw-hi-v\"><\u002Fspan><\u002Flabel>\n      <input id=\"tw-hi\" type=\"range\" min=\"0\" max=\"20\" step=\"1\" />\n    <\u002Fdiv>\n\n    <div class=\"row\">\n      <label>Ridge climb <span id=\"tw-ridge-v\"><\u002Fspan><\u002Flabel>\n      <input id=\"tw-ridge\" type=\"range\" min=\"0\" max=\"30\" step=\"0.5\" />\n    <\u002Fdiv>\n\n    <div class=\"row\">\n      <label>Atmosphere <span id=\"tw-fog-v\"><\u002Fspan><\u002Flabel>\n      <input id=\"tw-fog\" type=\"range\" min=\"0\" max=\"0.05\" step=\"0.001\" />\n    <\u002Fdiv>\n\n    <div class=\"toggle\">\n      <label style=\"margin:0\">Show overlay copy<\u002Flabel>\n      <button id=\"tw-overlay\" aria-label=\"Toggle overlay\"><\u002Fbutton>\n    <\u002Fdiv>\n  `;\n  document.body.appendChild(wrap);\n\n  const $ = (s) => wrap.querySelector(s);\n\n  const lineEl = $('#tw-line');\n  const lineV  = $('#tw-line-v');\n  const hiEl   = $('#tw-hi');\n  const hiV    = $('#tw-hi-v');\n  const ridgeEl= $('#tw-ridge');\n  const ridgeV = $('#tw-ridge-v');\n  const fogEl  = $('#tw-fog');\n  const fogV   = $('#tw-fog-v');\n  const ovBtn  = $('#tw-overlay');\n\n  function syncUI(){\n    lineEl.value = tweaks.lineOpacity;   lineV.textContent  = tweaks.lineOpacity.toFixed(2);\n    hiEl.value   = tweaks.highlightShare; hiV.textContent   = tweaks.highlightShare + '%';\n    ridgeEl.value= tweaks.ridgeGain;      ridgeV.textContent= tweaks.ridgeGain.toFixed(0);\n    fogEl.value  = tweaks.fogDensity;     fogV.textContent  = tweaks.fogDensity.toFixed(3);\n    ovBtn.classList.toggle('on', tweaks.showOverlay);\n    wrap.querySelectorAll('.swatch').forEach(s => {\n      s.classList.toggle('active', s.dataset.p === tweaks.palette);\n    });\n  }\n  syncUI();\n\n  function setKey(key, val){\n    tweaks[key] = val;\n    if (key === 'ridgeGain'){\n      // Re-derive y-positions for all base nodes when the ridge gain changes\n      const old = TWEAK_DEFAULTS.ridgeGain;\n      const ratio = val / old;\n      for (let i = 0; i < nodes.length; i++){\n        const n = nodes[i];\n        // stretch around y = -4 baseline\n        n.basePos.y = (n.basePos.y + 4) * (val / old) - 4;\n        // also rebase noise — but simple stretch is fine and reversible if we cache; we accept drift\n      }\n      // Reset old to current so further changes stretch from current\n      TWEAK_DEFAULTS.ridgeGain = val;\n      // Also rebuild line geometry endpoints from new basePos\n      for (let li = 0; li < linkIndices.length; li += 2){\n        const a = nodes[linkIndices[li]];\n        const b = nodes[linkIndices[li+1]];\n        const off = li * 3;\n        linesArr[off+1] = a.basePos.y;\n        linesArr[off+4] = b.basePos.y;\n      }\n      lineGeo.attributes.position.needsUpdate = true;\n    }\n    applyTweaks(tweaks);\n    syncUI();\n    window.parent.postMessage({type:'__edit_mode_set_keys', edits:{[key]: val}}, '*');\n  }\n\n  lineEl.addEventListener('input',  e => setKey('lineOpacity',    parseFloat(e.target.value)));\n  hiEl.addEventListener('input',    e => setKey('highlightShare', parseInt(e.target.value, 10)));\n  ridgeEl.addEventListener('input', e => setKey('ridgeGain',      parseFloat(e.target.value)));\n  fogEl.addEventListener('input',   e => setKey('fogDensity',     parseFloat(e.target.value)));\n  ovBtn.addEventListener('click',   () => setKey('showOverlay',   !tweaks.showOverlay));\n  wrap.querySelectorAll('.swatch').forEach(s => {\n    s.addEventListener('click', () => setKey('palette', s.dataset.p));\n  });\n\n  $('#tw-close').addEventListener('click', () => {\n    hidePanel();\n    window.parent.postMessage({type:'__edit_mode_dismissed'}, '*');\n  });\n\n  return wrap;\n}\nconst panel = buildPanel();\nfunction showPanel(){ panel.classList.add('open'); }\nfunction hidePanel(){ panel.classList.remove('open'); }\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
