<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="auto" role="img" aria-labelledby="sia-title sia-desc" preserveAspectRatio="xMidYMid meet">
  <title id="sia-title">Strategy in Action framework</title>
  <desc id="sia-desc">A diagram showing Value Generation at the centre, surrounded by three interconnected nodes — Strategic Opportunity-Risk, Capability Investment, and Catalytic Action — framed by Immediate Conditions and Emergent Conditions arcs.</desc>

  <defs>
    <path id="sia-arc-left"  d="M 96 100 A 257 257 0 0 0 96 412" fill="none"/>
    <path id="sia-arc-right" d="M 504 100 A 257 257 0 0 1 504 412" fill="none"/>
  </defs>

  <!-- Arc labels -->
  <g fill="#4A5568" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="1.8">
    <text>
      <textPath href="#sia-arc-left" startOffset="50%" text-anchor="middle">IMMEDIATE CONDITIONS</textPath>
    </text>
    <text>
      <textPath href="#sia-arc-right" startOffset="50%" text-anchor="middle">EMERGENT CONDITIONS</textPath>
    </text>
  </g>

  <!-- Connecting lines (every node to every other node) -->
  <g stroke="#4A8FCF" stroke-width="1.25" stroke-opacity="0.55" stroke-linecap="round">
    <!-- Center → Top -->
    <line x1="300" y1="198" x2="300" y2="154"/>
    <!-- Center → Bottom-Left -->
    <line x1="250" y1="285" x2="211" y2="307"/>
    <!-- Center → Bottom-Right -->
    <line x1="350" y1="285" x2="389" y2="307"/>
    <!-- Top → Bottom-Left -->
    <line x1="271" y1="146" x2="190" y2="286"/>
    <!-- Top → Bottom-Right -->
    <line x1="329" y1="146" x2="410" y2="286"/>
    <!-- Bottom-Left → Bottom-Right -->
    <line x1="219" y1="336" x2="381" y2="336"/>
  </g>

  <!-- Nodes -->
  <g fill="#FAF7F0" stroke="#4A8FCF" stroke-width="2">
    <circle cx="300" cy="256" r="58"/>
    <circle cx="300" cy="96"  r="58"/>
    <circle cx="161" cy="336" r="58"/>
    <circle cx="439" cy="336" r="58"/>
  </g>

  <!-- Node labels -->
  <g fill="#0B1D26" font-family="'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif" font-size="13" font-weight="500" text-anchor="middle">
    <!-- Center: Value Generation -->
    <text x="300" y="252">
      <tspan x="300" dy="0">Value</tspan>
      <tspan x="300" dy="17">Generation</tspan>
    </text>
    <!-- Top: Strategic Opportunity-Risk -->
    <text x="300" y="84">
      <tspan x="300" dy="0">Strategic</tspan>
      <tspan x="300" dy="17">Opportunity-Risk</tspan>
    </text>
    <!-- Bottom-Left: Capability Investment -->
    <text x="161" y="332">
      <tspan x="161" dy="0">Capability</tspan>
      <tspan x="161" dy="17">Investment</tspan>
    </text>
    <!-- Bottom-Right: Catalytic Action -->
    <text x="439" y="332">
      <tspan x="439" dy="0">Catalytic</tspan>
      <tspan x="439" dy="17">Action</tspan>
    </text>
  </g>
</svg>
