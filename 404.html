<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>document.documentElement.classList.add('js');</script>
  <title>Page Not Found — Resilient Futures</title>
  <!-- head-meta:start -->
  <link rel="icon" type="image/png" href="/rf.png">
  <link rel="apple-touch-icon" href="/rf.png">
  <meta name="robots" content="noindex, nofollow">
  <!-- head-meta:end -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body class="page-404">

<!-- ═══════════════════════════ NAV ═══════════════════════════ -->
<div data-include="nav"></div>

<!-- ═══════════════════════════ 404 ═══════════════════════════ -->
<main style="
  background: var(--rf-navy);
  padding: 0 48px;
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
">
  <!-- Ambient glows -->
  <div style="position:absolute; top:-120px; right:-80px; width:600px; height:600px; border-radius:50%; background: radial-gradient(circle, rgba(123,155,209,0.07) 0%, transparent 65%); pointer-events:none;"></div>
  <div style="position:absolute; bottom:-80px; left:-60px; width:440px; height:440px; border-radius:50%; background: radial-gradient(circle, rgba(58,90,146,0.06) 0%, transparent 65%); pointer-events:none;"></div>

  <div class="section-inner" style="position:relative; z-index:1; padding: 96px 0;">

    <!-- 404 display number -->
    <div class="font-display" style="
      font-size: 160px;
      font-weight: 800;
      color: rgba(123,155,209,0.12);
      line-height: 1;
      letter-spacing: -0.04em;
      margin-bottom: -24px;
      user-select: none;
    ">404</div>

    <!-- Accent line -->
    <div style="width: 48px; height: 3px; background: var(--rf-accent); margin-bottom: 32px;"></div>

    <h1 class="font-display" style="
      font-size: 47px;
      font-weight: 700;
      color: var(--rf-white);
      line-height: 1.1;
      letter-spacing: -0.025em;
      max-width: 560px;
      margin-bottom: 20px;
    ">This page doesn&rsquo;t exist.</h1>

    <p style="
      font-size: 18px;
      line-height: 1.7;
      color: rgba(255,255,255,0.65);
      max-width: 480px;
      margin-bottom: 48px;
    ">
      The page you were looking for isn&rsquo;t here. It may have moved, or the link may be wrong.
      Head back and find what you need.
    </p>

    <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap;">
      <a href="index.html" class="btn-primary">Back to home</a>
      <a href="contact.html" class="btn-secondary">Get in touch</a>
    </div>

  </div>
</main>

<!-- ═══════════════════════════ FOOTER ═══════════════════════════ -->
<div data-include="footer"></div>

  <script src="assets/js/includes.js" defer></script>
  <script src="assets/js/reveal.js" defer></script>
</body>
</html>
